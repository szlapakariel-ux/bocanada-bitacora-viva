# Configuración de build para Railway (Nixpacks) cuando Root Directory = retons-seguimiento.
# Un solo servicio: compila el cliente React y arranca el server Express que lo sirve.
# El `prisma db push` corre en el ARRANQUE (start:prod), porque el volumen /data
# recién se monta en runtime, no durante el build.

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
  "cd client && npm install",
  "cd server && npm install",
]

[phases.build]
cmds = [
  "cd client && npm run build",
]

[start]
cmd = "cd server && npm run start:prod"
